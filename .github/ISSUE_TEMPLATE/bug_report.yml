name: Bug report
description: Report a reproducible EvoBlue Video MCP problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: What could you not complete? Do not include API keys, cookies, private URLs, or unredacted logs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and operating system
    validations:
      required: true

