[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evoblue-video-mcp"
version = "0.1.0"
description = "Local-first video understanding and Markdown knowledge management"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Wilson Gu" }]
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "mcp[cli]>=2,<3",
  "platformdirs>=4,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "structlog>=25,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
  "yt-dlp>=2025.1.26"
]

[project.optional-dependencies]
asr = [
  "sherpa-onnx>=1.10,<2",
  "numpy>=1.26,<2.3",
  "onnxruntime>=1.27,<2; sys_platform == 'win32'"
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1"
]
package = [
  "pyinstaller>=6.10,<7"
]

[project.scripts]
evoblue-bridge = "evoblue_video_mcp.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evoblue_video_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# Resource-leak gate: an abandoned AsyncSession/connection surfaces as an
# unraisable SAWarning during GC, which the plain -W filter misses (it is
# wrapped by pytest as PytestUnraisableExceptionWarning). Escalate both.
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # aiosqlite worker threads outliving a closed event loop leak as an
    # unhandled thread exception — timing-dependent, so it must be an ERROR
    # gate rather than something an exit-0 run can hide.
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# .codex-worktrees/ holds foreign agent-session worktrees checked out inside
# the repo directory; they are not this project's code.
extend-exclude = [".codex-worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# This contract test quotes Chinese doc headings verbatim (fullwidth chars are
# part of the heading text it must locate).
"tests/contract/test_client_config_formats.py" = ["RUF001"]
# Same for the P5 write-contract drift + structural gates.
"tests/contract/test_client_write_contract.py" = ["RUF001"]
"tests/contract/test_client_write_guards.py" = ["RUF001"]
# The client registry strings must byte-match the contract doc's §1 table
# (fullwidth punctuation included) — that is the drift lock working.
"src/evoblue_video_mcp/application/client_config/specs.py" = ["RUF001"]
# User-facing Chinese copy correctly uses fullwidth punctuation.
"src/evoblue_video_mcp/application/client_config/service.py" = ["RUF001"]
"src/evoblue_video_mcp/application/client_config/adapters/file_auto.py" = ["RUF001"]
"src/evoblue_video_mcp/application/client_config/adapters/claude_code.py" = ["RUF001"]
"src/evoblue_video_mcp/application/client_config/adapters/deepseek.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["evoblue_video_mcp"]
