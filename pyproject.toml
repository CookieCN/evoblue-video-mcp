[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evoblue-video-mcp"
version = "0.1.0"
description = "Local-first video understanding and Markdown knowledge management"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Wilson Gu" }]
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "mcp[cli]>=2,<3",
  "platformdirs>=4,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "structlog>=25,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
  "yt-dlp>=2025.1.26"
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/evoblue_video_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["evoblue_video_mcp"]

